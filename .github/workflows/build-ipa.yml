name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned .app
        run: |
          xcodebuild -project AIClip.xcodeproj \
            -scheme AIClip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIClip.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/AIClip.xcarchive/Products/Applications/AIClip.app Payload/
          zip -r AIClip-unsigned.ipa Payload
          ls -lh AIClip-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIClip-unsigned-ipa
          path: AIClip-unsigned.ipa
